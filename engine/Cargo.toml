[package]
name = "cs-tool-engine"
version = "0.0.1"
edition = "2021"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "mysql", "postgres"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
redis = { version = "0.32", features = ["tokio-rustls-comp"] }
sqlparser = "0.59"
uuid = { version = "1", features = ["v4"] }
url = "2"
