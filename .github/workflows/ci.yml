name: macOS checks
on:
  push:
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
      - name: Locked dependency inventory
        run: python3 tools/dependency-inventory.py
      - name: Transparent application icon
        run: swift tools/icon-regression.swift
      - name: Rust engine
        run: |
          cargo test --locked --manifest-path engine/Cargo.toml
          cargo build --locked --manifest-path engine/Cargo.toml
      - name: Native tests and worker protocol
        env:
          CSTOOLX_ENGINE: ${{ github.workspace }}/engine/target/debug/cs-tool-engine
        run: swift test --disable-keychain --force-resolved-versions
      - name: CLI contract and concurrent configuration
        run: |
          swift build --disable-keychain --force-resolved-versions --product cs-tool-x
          python3 tools/cli-regression.py --binary "$(swift build --disable-keychain --force-resolved-versions --show-bin-path)/cs-tool-x"
          python3 tools/cli-installer-regression.py
          python3 tools/toolbox-regression.py --binary .build/debug/cs-tool-x
      - name: Cursor ownership regression
        run: |
          mkdir -p .local
          swiftc -parse-as-library Sources/CSToolX/WritingCursors.swift Sources/CSToolX/WritingCursorPreviewTheme.swift Sources/CSToolX/WritingDragCursor.swift tools/cursor-regression.swift -o .local/cursor-regression
          .local/cursor-regression
      - name: Terminal colors and local PTY
        timeout-minutes: 3
        run: python3 tools/terminal-color-regression.py
      - name: Data tree component regression
        timeout-minutes: 3
        run: |
          swiftc -parse-as-library -I .build/debug/Modules Sources/CSToolX/Theme.swift Sources/CSToolX/PaperControls.swift Sources/CSToolX/WorkbenchWindow.swift Sources/CSToolX/WritingCursors.swift Sources/CSToolX/WritingCursorPreviewTheme.swift Sources/CSToolX/WritingDragCursor.swift Sources/CSToolX/Shell/ActionTarget.swift Sources/CSToolX/DataNavigator.swift Sources/CSToolX/DataBrowser.swift Sources/CSToolX/DataWorkspace.swift .build/debug/ToolCore.build/*.o tools/data-tree-ui-regression.swift -o .local/data-tree-ui-regression
          python3 tools/run-ui-regression.py .local/data-tree-ui-regression
      - name: Read-only Git browser
        timeout-minutes: 3
        run: |
          python3 tools/git-browser-regression.py --binary .build/debug/cs-tool-x --write-fixture .local/git-ui-fixture
          swiftc -parse-as-library -I .build/debug/Modules Sources/CSToolX/Theme.swift Sources/CSToolX/PaperControls.swift Sources/CSToolX/WorkbenchWindow.swift Sources/CSToolX/WritingCursors.swift Sources/CSToolX/WritingCursorPreviewTheme.swift Sources/CSToolX/WritingDragCursor.swift Sources/CSToolX/GitLogList.swift Sources/CSToolX/GitFilesList.swift Sources/CSToolX/GitSidebar.swift Sources/CSToolX/GitWorkspace.swift .build/debug/ToolCore.build/*.o tools/git-ui-regression.swift -o .local/git-ui-regression
          python3 tools/run-ui-regression.py .local/git-ui-regression .local/git-ui-fixture
      - name: Illustrated launcher
        timeout-minutes: 3
        run: |
          swiftc -parse-as-library -I .build/debug/Modules Sources/CSToolX/Theme.swift Sources/CSToolX/PaperControls.swift Sources/CSToolX/WorkbenchWindow.swift Sources/CSToolX/WritingCursors.swift Sources/CSToolX/WritingCursorPreviewTheme.swift Sources/CSToolX/WritingDragCursor.swift Sources/CSToolX/LauncherView.swift .build/debug/ToolCore.build/*.o tools/launcher-ui-regression.swift -o .local/launcher-ui-regression
          python3 tools/run-ui-regression.py .local/launcher-ui-regression Resources/Entrances
      - name: Offline toolbox layouts
        timeout-minutes: 3
        run: |
          swiftc -parse-as-library -I .build/debug/Modules Sources/CSToolX/Theme.swift Sources/CSToolX/PaperControls.swift Sources/CSToolX/WorkbenchWindow.swift Sources/CSToolX/WritingCursors.swift Sources/CSToolX/WritingCursorPreviewTheme.swift Sources/CSToolX/WritingDragCursor.swift Sources/CSToolX/ToolboxWorkspace.swift Sources/CSToolX/TransientTextEditor.swift Sources/CSToolX/TransientTextWorkspace.swift .build/debug/ToolCore.build/*.o tools/toolbox-ui-regression.swift -o .local/toolbox-ui-regression
          python3 tools/run-ui-regression.py .local/toolbox-ui-regression
      - name: Temporary text and Markdown
        timeout-minutes: 3
        run: |
          swift build --disable-keychain --force-resolved-versions --product cs-tool-markdown
          python3 tools/text-workbench-regression.py --binary .build/debug/cs-tool-x --worker .build/debug/cs-tool-markdown
          swiftc -parse-as-library -I .build/debug/Modules Sources/CSToolX/Theme.swift Sources/CSToolX/PaperControls.swift Sources/CSToolX/WorkbenchWindow.swift Sources/CSToolX/WritingCursors.swift Sources/CSToolX/WritingCursorPreviewTheme.swift Sources/CSToolX/WritingDragCursor.swift Sources/CSToolX/TransientTextEditor.swift Sources/CSToolX/TransientTextWorkspace.swift .build/debug/ToolCore.build/*.o tools/text-editor-ui-regression.swift -o .local/text-editor-ui-regression
          python3 tools/run-ui-regression.py .local/text-editor-ui-regression .build/debug/cs-tool-markdown
      - name: Native development bundle
        run: python3 scripts/build.py --development --configuration debug
